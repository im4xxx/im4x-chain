[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "im4x-chain"
version = "0.1.0"
description = "Voice chain for voice-over recordings without the iZotope RX app: EQ, RX 12 plugins (De-plosive, Mouth De-click, Spectral De-noise), gate, Leveler, compressor, Loudness Control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numba>=0.68.1",
  "numpy>=2.0",
  "pedalboard>=0.9.26",
  "scipy>=1.11",
  "soundfile>=0.12",
]

[project.scripts]
im4x-chain = "im4x_chain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/im4x_chain"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
